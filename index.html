<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>김도훈 (@ybab.mik) · Instagram</title>
<style>
:root{--ink:#171717;--muted:#737373;--line:#dbdbdb;--blue:#0095f6}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:975px;margin:auto;padding:26px 28px 56px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}
.back,.more{border:0;background:transparent;padding:5px;color:#222}
.top-actions{display:flex;align-items:center;gap:20px}
.menu{position:relative}
.menu-pop{display:none;position:absolute;right:0;top:36px;z-index:5;min-width:170px;background:white;border:1px solid #eee;border-radius:8px;box-shadow:0 8px 30px #0001;overflow:hidden}
.menu-pop.show{display:block}
.menu-pop button{display:block;width:100%;padding:12px 15px;border:0;background:white;text-align:left;font-size:13px}
.profile{display:grid;grid-template-columns:minmax(120px,1fr) 2fr;gap:34px;align-items:center;margin-bottom:36px}
.avatar-wrap{display:flex;justify-content:center}
.avatar{width:150px;height:150px;border-radius:50%;padding:4px;background:linear-gradient(135deg,#ffb347,#ff5277,#a855f7);display:block;border:0;flex-shrink:0}
.avatar img{display:block;width:100%;height:100%;border-radius:50%;border:4px solid white;object-fit:cover}
.heading{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.username{font-size:23px;font-weight:400}
.verified{width:17px;height:17px;border-radius:50%;background:#3897f0;color:white;display:inline-grid;place-items:center;font-size:11px;font-weight:800}
.stats{display:flex;gap:38px;margin-bottom:20px}
.stat{font-size:16px}
.stat strong{font-weight:650}
.bio{font-size:14px;line-height:1.7}
.display-name{font-weight:650}
.actions{display:grid;grid-template-columns:1fr 1fr 54px;gap:10px;margin-bottom:12px}
.action{border:1px solid var(--line);border-radius:7px;background:white;min-height:42px;font-weight:600;color:#262626}
.action.following{background:#f5f5f5}
.stories{display:flex;align-items:flex-start;gap:18px;overflow-x:auto;padding:12px 0 22px;margin:0 0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.stories::-webkit-scrollbar{display:none}
.story-item{flex:0 0 80px;width:80px;min-width:80px;padding:0;margin:0;border:0;background:transparent;color:#262626;text-align:center}
.story-ring{display:block;width:80px;height:80px;padding:4px;margin:0 auto 7px;border:1px solid #e6e7ea;border-radius:50%;background:#e8e9ec}
.story-ring img{display:block;width:100%;height:100%;border:3px solid #fff;border-radius:50%;background:#f5f5f5;object-fit:cover}
.add-story .new-ring{display:flex;align-items:center;justify-content:center;padding:0;border:1.3px solid #262626;background:#fff}
.add-story .plus{display:block;color:#111;font-size:42px;font-weight:300;line-height:1;transform:translateY(-2px)}
.story-label{display:block;width:100%;overflow:hidden;color:#262626;font-size:12px;font-weight:400;line-height:18px;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:grid;grid-template-columns:1fr 1fr;width:100%;height:52px;gap:0;border-bottom:1px solid var(--line);margin-bottom:4px}
.tab{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;padding:0;border:0;background:transparent;color:#8e8e8e}
.tab svg{display:block;flex-shrink:0}
.tab.active{color:#111}
.tab.active:after{content:"";position:absolute;height:2px;background:#111;bottom:-1px;left:0;right:0}

/* 피드 썸네일 */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.post{position:relative;aspect-ratio:3/4;border:0;padding:0;overflow:hidden;background:#eee}
.post img{width:100%;height:100%;display:block;object-fit:cover}
.heart{display:none!important}
.pin-badge{position:absolute;top:8px;right:8px;z-index:2;width:22px;height:22px;display:grid;place-items:center;pointer-events:none;filter:drop-shadow(0 1px 3px #0009)}
.pin-badge svg{width:100%;height:100%}
.multi-badge{position:absolute;top:8px;right:8px;z-index:2;width:20px;height:20px;pointer-events:none;filter:drop-shadow(0 1px 3px #0009)}
.multi-badge svg{width:100%;height:100%}
/* 마우스를 올리면 인스타그램처럼 어두워지면서 좋아요 수가 보임 */
.post .overlay{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;background:rgba(0,0,0,.35);color:#fff;font-size:16px;font-weight:650;opacity:0;transition:opacity .15s;pointer-events:none}
.post .overlay svg{width:22px;height:22px;flex-shrink:0}
.post:hover .overlay,.post:focus-visible .overlay{opacity:1}

.footer{padding:24px 0;color:#999;font-size:11px;text-align:center}

/* 게시물 상세 창 (인스타그램 스타일) */
.modal{display:none;position:fixed;inset:0;z-index:10;background:#000b;align-items:center;justify-content:center;padding:44px 20px 20px}
.modal.open{display:flex}
.close{position:fixed;top:12px;right:20px;color:white;background:transparent;border:0;font-size:36px;font-weight:200}
.modal-card{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,.8fr);width:min(100%,1040px);height:min(90vh,720px);background:#fff;border-radius:4px;overflow:hidden}
.modal-image{position:relative;background:#000;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;overflow:hidden}
.modal-image img{width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.modal-side{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;border-left:1px solid #efefef}
.modal-head{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #efefef;font-size:14px;font-weight:650;flex-shrink:0}
.modal-head .verified{width:14px;height:14px;font-size:9px;margin-left:-6px}
.head-more{margin-left:auto;border:0;background:transparent;padding:4px;font-size:15px;color:#262626}
.tiny-avatar{width:32px;height:32px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#ffb347,#ff5277,#a855f7);flex-shrink:0}
.tiny-avatar img{display:block;width:100%;height:100%;border:2px solid white;border-radius:50%;object-fit:cover}
.modal-scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 16px}
.caption-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
.caption-body{min-width:0;font-size:14px;line-height:1.5;overflow-wrap:anywhere;padding-top:5px}
.caption-body strong{margin-right:6px}
.comments-list{display:flex;flex-direction:column;gap:16px;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.comment-item{display:flex;gap:12px;align-items:flex-start}
.comment-avatar{width:32px;height:32px;border-radius:50%;background:#efefef;color:#8e8e8e;display:grid;place-items:center;font-size:13px;font-weight:650;flex-shrink:0}
.comment-main{min-width:0;padding-top:5px}
.comment-name{font-weight:650;margin-right:6px}
.comment-text{white-space:pre-wrap;overflow-wrap:anywhere}
.comment-empty{color:#8e8e8e;font-size:14px;text-align:center;padding:24px 0}
.modal-actions{display:flex;align-items:center;gap:14px;padding:6px 14px 0;border-top:1px solid #efefef;flex-shrink:0}
.icon-btn{border:0;background:transparent;padding:6px 2px;color:#262626;display:grid;place-items:center}
.icon-btn:hover{color:#8e8e8e}
.icon-btn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.liked svg{fill:#ed4956;stroke:#ed4956}
.icon-btn.saved svg{fill:currentColor}
.icon-btn.push-right{margin-left:auto}
.modal-likes{padding:2px 16px 0;font-size:14px;font-weight:650;flex-shrink:0}
.modal-date{padding:4px 16px 12px;font-size:11px;color:#8e8e8e;flex-shrink:0}
.comment-form{border-top:1px solid #efefef;padding:6px 14px 10px;flex-shrink:0}
.comment-form input{width:100%;min-width:0;border:0;outline:none;font:inherit;font-size:14px;padding:8px 0;background:transparent}
.comment-form .name-input{font-size:12px;color:#737373;border-bottom:1px solid #f3f3f3;padding:6px 0}
.comment-write-row{display:flex;align-items:center;gap:10px}
.comment-write-row .emoji{font-size:20px;line-height:1;flex-shrink:0;opacity:.85}
.comment-write-row button{border:0;background:transparent;color:var(--blue);font-weight:650;font-size:14px;flex-shrink:0;padding:4px}
.comment-write-row button:disabled{opacity:.4;cursor:default}
.comment-status{margin:4px 0 0;font-size:12px;color:#8e8e8e;line-height:1.5}

/* 사진 여러 장 넘기기 */
.car-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:30px;height:30px;border:0;border-radius:50%;background:#fffd;color:#222;font-size:18px;line-height:1;display:grid;place-items:center;box-shadow:0 1px 4px #0004}
.car-btn[hidden]{display:none}
.car-prev{left:10px}
.car-next{right:10px}
.car-dots{position:absolute;left:0;right:0;bottom:12px;z-index:3;display:flex;justify-content:center;gap:5px;pointer-events:none}
.car-dots i{width:6px;height:6px;border-radius:50%;background:#ffffff80}
.car-dots i.on{background:#0095f6}

/* 사진을 두 번 누르면 나오는 하트 */
.big-heart{position:absolute;left:50%;top:50%;z-index:4;width:96px;height:96px;margin:-48px 0 0 -48px;opacity:0;pointer-events:none;filter:drop-shadow(0 2px 10px #0006)}
.big-heart svg{width:100%;height:100%}
.big-heart.pop{animation:heartPop .85s ease}
@keyframes heartPop{
0%{opacity:0;transform:scale(.4)}
20%{opacity:.95;transform:scale(1.15)}
40%{opacity:.95;transform:scale(1)}
80%{opacity:.95;transform:scale(1)}
100%{opacity:0;transform:scale(1.1)}
}

.story-viewer{display:none;position:fixed;z-index:50;inset:0;align-items:center;justify-content:center;background:#101010;color:white}
.story-viewer.open{display:flex}
.story-screen{position:relative;width:min(100%,430px);height:min(100dvh,900px);overflow:hidden;background:#202020}
.story-photo{position:absolute;inset:0;width:100%;height:100%;background:#171717;object-fit:contain}
.story-shade{position:absolute;inset:0;background:linear-gradient(to bottom,#0008,transparent 22%,transparent 70%,#0008);pointer-events:none}

/* 스토리 진행 바: 사진 한 장당 흰색 줄 하나 */
.story-progress{position:absolute;z-index:2;top:9px;left:8px;right:8px;display:flex;gap:4px}
.story-seg{flex:1;height:2px;border-radius:2px;background:#ffffff66;overflow:hidden}
.story-seg i{display:block;width:0;height:100%;background:#fff}
.story-seg.done i{width:100%}
.story-seg.active i{animation:storyFill 5s linear forwards}
@keyframes storyFill{from{width:0}to{width:100%}}

.story-header{position:absolute;z-index:3;top:20px;left:12px;right:12px;display:flex;align-items:center;gap:9px}
.story-profile{width:35px;height:35px;border:1px solid #ffffff88;border-radius:50%;object-fit:cover}
.story-user{font-size:13px;font-weight:650}
.story-time{color:#ffffffb8;font-size:12px;font-weight:400}
.story-header-actions{display:flex;align-items:center;gap:14px;margin-left:auto}
.story-icon{padding:2px;border:0;background:transparent;color:white;font-size:23px}
.story-close{font-size:30px;font-weight:300}
.story-nav{position:absolute;z-index:2;top:65px;bottom:15px;width:28%;border:0;background:transparent}
.story-prev{left:0}
.story-next{right:0}
.photo-viewer{display:none;position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.94);align-items:center;justify-content:center;padding:24px}
.photo-viewer.open{display:flex}
.photo-viewer img{display:block;max-width:100%;max-height:90dvh;width:auto;height:auto;object-fit:contain}
.photo-close{position:absolute;top:12px;right:17px;border:0;background:transparent;color:#fff;font-size:36px;font-weight:300;line-height:1}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:#262626;color:white;padding:11px 16px;border-radius:8px;font-size:13px;transition:.25s;pointer-events:none;z-index:100}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* 모바일 전용 요소 (데스크톱에서는 숨김) */
.top-username{display:none}
.bottom-nav{display:none}

@media(max-width:650px){
body{background:#fff}
.app{padding:0 0 calc(64px + env(safe-area-inset-bottom))}

/* 상단 바: 뒤로가기 + 사용자 이름 + 알림/더보기 */
.topbar{padding:8px 12px;margin-bottom:6px;min-height:48px}
.top-username{display:flex;align-items:center;gap:5px;flex:1;margin-left:6px;font-size:20px;font-weight:700;letter-spacing:-.2px}
.top-username .verified{width:15px;height:15px;font-size:10px}
.top-actions{gap:12px}

/* 프로필: 사진 왼쪽, 숫자 오른쪽, 이름은 아래 */
.profile{grid-template-columns:auto 1fr;grid-template-areas:"avatar stats" "bio bio";gap:12px 18px;padding:4px 16px 0;margin-bottom:14px;align-items:center}
.profile-info{display:contents}
.avatar-wrap{grid-area:avatar}
.heading{display:none}
.avatar{width:86px;height:86px;padding:3px}
.avatar img{border-width:3px}
.stats{grid-area:stats;gap:0;justify-content:space-around;margin:0}
.stat{flex:1;font-size:14px;text-align:center;line-height:1.3}
.stat strong{display:block;font-size:17px;font-weight:700}
.bio{grid-area:bio;font-size:14px;line-height:1.45}

/* 버튼: 회색 둥근 버튼 */
.actions{padding:0 16px;grid-template-columns:1fr 1fr 36px;gap:6px;margin-bottom:14px}
.action{min-height:32px;border:0;border-radius:8px;background:#efefef;font-size:14px;font-weight:650;color:#111}
.action.following{background:#efefef}

/* 하이라이트: 작은 동그라미 */
.stories{gap:14px;padding:2px 16px 14px;margin:0}
.story-item{flex:0 0 66px;width:66px;min-width:66px}
.story-ring{width:66px;height:66px;padding:3px;margin-bottom:6px}
.story-ring img{border-width:2px}
.add-story .plus{font-size:34px}
.story-label{font-size:12px}

.tabs{grid-template-columns:1fr 1fr;gap:0;height:44px;margin-bottom:1px}
.tab svg{width:24px;height:24px}
.grid{gap:1px}
.post .overlay{display:none}
.pin-badge{top:6px;right:6px;width:19px;height:19px}
.multi-badge{top:6px;right:6px;width:18px;height:18px}

/* 하단 메뉴 바 */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-around;align-items:center;height:calc(50px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid #efefef}
.bottom-nav button{flex:1;height:50px;border:0;background:transparent;color:#111;display:grid;place-items:center;padding:0}
.bottom-nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.bottom-nav .nav-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;border:1.5px solid #111;padding:1px;background:#fff}

/* 게시물 상세: 인스타그램 앱처럼 위에서 아래로 */
.modal{padding:0;align-items:stretch;background:#fff}
.modal::before{content:"게시물";position:fixed;top:0;left:0;right:0;height:48px;display:grid;place-items:center;background:#fff;border-bottom:1px solid #efefef;font-size:16px;font-weight:700;z-index:11}
.close{top:0;left:0;right:auto;z-index:12;width:48px;height:48px;display:grid;place-items:center;font-size:0;color:#111;background:transparent}
.close::before{content:"‹";font-size:36px;line-height:1;font-weight:300;transform:translateY(-2px)}
.modal-card{display:flex;flex-direction:column;width:100%;max-width:none;height:100dvh;max-height:none;padding-top:48px;overflow-y:auto;overflow-x:hidden;border-radius:0;-webkit-overflow-scrolling:touch}
.modal-side{display:contents}
.modal-head{order:0;padding:10px 12px;border-bottom:0;font-size:14px}
.modal-image{order:1;flex-shrink:0;width:100%;aspect-ratio:4/5;min-height:0}
.modal-image img{width:100%;height:100%;max-height:none;object-fit:cover}
.modal-actions{order:2;border-top:0;padding:4px 12px 0}
.modal-likes{order:3;padding:2px 14px 0}
.modal-scroll{order:4;flex:none;overflow:visible;padding:6px 14px 0}
.caption-row{margin-bottom:10px}
.caption-row .tiny-avatar{display:none}
.caption-body{padding-top:0}
.comments-list{gap:12px}
.comment-avatar{width:28px;height:28px;font-size:12px}
.comment-main{padding-top:3px}
.modal-date{order:5;padding:6px 14px 14px}
.comment-form{order:6;position:sticky;bottom:0;margin-top:auto;background:#fff;padding:6px 14px calc(8px + env(safe-area-inset-bottom))}

.story-screen{width:100%;height:100dvh}
.toast{bottom:calc(66px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<main class="app">
<header class="topbar">
<button class="back" id="backBtn" aria-label="뒤로">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 3 6 12l9 9"/></svg>
</button>
<!-- 모바일 전용: 상단 사용자 이름 (PC에서는 CSS로 숨김) -->
<div class="top-username">ybab.mik <span class="verified">✓</span></div>
<div class="top-actions">
<button class="more" id="bellBtn" aria-label="알림">
<svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4M12 3V1"/></svg>
</button>
<div class="menu">
<button class="more" id="moreBtn" aria-label="더 보기">•••</button>
<div class="menu-pop" id="menuPop">
<button data-toast="가상 프로필 링크입니다">프로필 링크 복사</button>
<button data-toast="이 프로필은 가상 계정입니다">이 프로필 정보</button>
</div>
</div>
</div>
</header>

<section class="profile">
<div class="avatar-wrap">
<button class="avatar" id="profilePhotoBtn" aria-label="스토리 보기">
<img src="./브이.jpg" alt="김도훈 프로필 사진">
</button>
</div>
<div class="profile-info">
<div class="heading"><span class="username">ybab.mik</span><span class="verified">✓</span></div>
<div class="stats">
<div class="stat"><strong>9</strong> 게시물</div>
<div class="stat"><strong>3,482</strong> 팔로워</div>
<div class="stat"><strong>5</strong> 팔로잉</div>
</div>
<div class="bio"><div class="display-name">김도훈</div></div>
</div>
</section>

<section class="actions">
<button class="action following" id="followBtn">팔로잉⌄</button>
<button class="action" id="messageBtn">메시지 보내기</button>
<button class="action" id="friendBtn" aria-label="비슷한 계정">⌄</button>
</section>

<!-- 하이라이트: 프로필 사진(스토리)과 별개 -->
<section class="stories" aria-label="스토리 하이라이트">
<button class="story-item add-story" id="newStoryBtn">
<span class="story-ring new-ring"><span class="plus">＋</span></span>
<span class="story-label">New</span>
</button>
<button class="story-item" data-highlight="0">
<span class="story-ring"><img src="./하나만먹자.jpg" alt="❤️"></span>
<span class="story-label">❤️</span>
</button>
<button class="story-item" data-highlight="1">
<span class="story-ring"><img src="./먹을까.webp" alt="먹을까"></span>
<span class="story-label">📷</span>
</button>

</section>

<nav class="tabs" aria-label="프로필 게시물 메뉴">
<button class="tab active" id="postsTab" aria-label="게시물" aria-selected="true">

/* "좋아요 284개" 같은 문구에서 숫자만 꺼냄 */
function baseLikes(post) {
  return Number(String(post.likes || '').replace(/[^0-9]/g,'')) || 0;
}

function likeCount(index) {
  return baseLikes(posts[index]) + (likedPosts.has(index) ? 1 : 0);
}

  const img = document.createElement('img');

  img.alt = post.tag + ' 사진';

  button.appendChild(overlay);

    button.appendChild(pin);

  /* 사진이 여러 장이면 겹친 사각형 아이콘 표시 */

async function loadComments(postId) {
  commentsList.replaceChildren();
  commentsList.textContent = '댓글을 불러오는 중...';

  try {
    const url = `${SUPABASE_URL}/rest/v1/comments?post_id=eq.${postId}&select=id,display_name,body,created_at&order=created_at.asc`;
    const response = await fetch(url,{
      method:'GET',
      headers:supabaseHeaders()
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${await response.text()}`);
    }

    const comments = await response.json();
    commentsList.replaceChildren();

    if (!comments.length) {
      const empty = document.createElement('div');
      empty.className = 'comment-empty';
      empty.textContent = '첫 댓글을 남겨 보세요 🤍';
      commentsList.appendChild(empty);
      return;
    }

    comments.forEach(comment => {
      const displayName = comment.display_name || '익명';

      const item = document.createElement('div');
      item.className = 'comment-item';

      const avatar = document.createElement('div');
      avatar.className = 'comment-avatar';
      avatar.textContent = displayName.trim().charAt(0) || '익';

      const main = document.createElement('div');
      main.className = 'comment-main';

      const name = document.createElement('span');
      name.className = 'comment-name';
      name.textContent = displayName;

      const body = document.createElement('span');
      body.className = 'comment-text';
      body.textContent = comment.body;

      main.append(name,body);
      item.append(avatar,main);
      commentsList.appendChild(item);
    });
  } catch(error) {
    console.error('댓글 조회 오류:',error);
    commentsList.textContent = '댓글을 불러오지 못했어요. Supabase 설정과 권한을 확인해 주세요.';
    commentStatus.textContent = '오류가 계속되면 Supabase 설정을 확인해 주세요.';
  }
}

/* 댓글 내용이 비어 있으면 '게시' 버튼을 흐리게 */
commentBody.addEventListener('input',() => {
  commentSubmit.disabled = !commentBody.value.trim();
});

commentForm.addEventListener('submit',async event => {
  event.preventDefault();

  const displayName = commentName.value.trim() || '익명';
  const body = commentBody.value.trim();

  if (!body) {
    commentStatus.textContent = '댓글 내용을 입력해 줘.';
    return;
  }

  if (displayName.length > 30 || body.length > 500) {
    commentStatus.textContent = '닉네임은 30자, 댓글은 500자까지 가능해.';
    return;
  }

  commentSubmit.disabled = true;
  commentStatus.textContent = '댓글을 등록하는 중...';

  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/comments`,{
      method:'POST',
      headers:{
        ...supabaseHeaders(),
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      },
      body:JSON.stringify({
        post_id:currentPostId,
        display_name:displayName,
        body:body
      })
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${await response.text()}`);
    }

    commentBody.value = '';
    commentStatus.textContent = '댓글이 등록됐어!';
    await loadComments(currentPostId);
  } catch(error) {
    console.error('댓글 등록 오류:',error);
    commentStatus.textContent = '등록에 실패했어. Supabase 테이블과 권한을 확인해 줘.';
  } finally {
    commentSubmit.disabled = !commentBody.value.trim();
  }
});

const modalImg = document.getElementById('modalImg');
const modalImageBox = document.getElementById('modalImageBox');
const carPrev = document.getElementById('carPrev');
const carNext = document.getElementById('carNext');
const carDots = document.getElementById('carDots');
const likeBtn = document.getElementById('likeBtn');
const saveBtn = document.getElementById('saveBtn');
const bigHeart = document.getElementById('bigHeart');
let modalImages = [];
let modalIndex = 0;

function showModalImage(i) {
  modalIndex = Math.min(Math.max(i,0),modalImages.length - 1);
  modalImg.src = modalImages[modalIndex];

  const multi = modalImages.length > 1;
  carPrev.hidden = !multi || modalIndex === 0;
  carNext.hidden = !multi || modalIndex === modalImages.length - 1;

  carDots.replaceChildren();
  if (multi) {
    modalImages.forEach((_,n) => {
      const dot = document.createElement('i');
      if (n === modalIndex) dot.className = 'on';
      carDots.appendChild(dot);
    });
  }
}

carPrev.addEventListener('click',() => showModalImage(modalIndex - 1));
carNext.addEventListener('click',() => showModalImage(modalIndex + 1));

/* 좋아요·저장 버튼 모양, 좋아요 수, 피드 썸네일의 숫자를 한꺼번에 갱신 */
function refreshPostUI() {
  const i = currentPostId;
  const liked = likedPosts.has(i);
  const saved = savedPosts.has(i);

  likeBtn.classList.toggle('liked',liked);
  likeBtn.setAttribute('aria-pressed',String(liked));
  saveBtn.classList.toggle('saved',saved);
  saveBtn.setAttribute('aria-pressed',String(saved));

  document.getElementById('modalLikes').textContent = `좋아요 ${likeCount(i).toLocaleString('ko-KR')}개`;

  const count = grid.children[i] && grid.children[i].querySelector('.overlay-count');
  if (count) count.textContent = likeCount(i).toLocaleString('ko-KR');
}

function popHeart() {
  bigHeart.classList.remove('pop');
  void bigHeart.offsetWidth;
  bigHeart.classList.add('pop');
}

likeBtn.addEventListener('click',() => {
  if (likedPosts.has(currentPostId)) likedPosts.delete(currentPostId);
  else likedPosts.add(currentPostId);
  refreshPostUI();
});

saveBtn.addEventListener('click',() => {
  if (savedPosts.has(currentPostId)) {
    savedPosts.delete(currentPostId);
  } else {
    savedPosts.add(currentPostId);
    showToast('저장했어요.');
  }
  refreshPostUI();
});

document.getElementById('commentFocusBtn').addEventListener('click',() => commentBody.focus());

document.getElementById('shareBtn').addEventListener('click',() => {
  showToast('가상 프로필에서는 공유할 수 없어요.');
});

document.getElementById('headMoreBtn').addEventListener('click',() => {
  showToast('게시물 메뉴는 데모 기능이에요.');
});

/* 사진을 두 번 누르면 좋아요 + 큰 하트 */
modalImageBox.addEventListener('dblclick',event => {
  if (event.target.closest('button')) return;
  likedPosts.add(currentPostId);
  refreshPostUI();
  popHeart();
});

function openPost(index) {
  const post = posts[index];
  currentPostId = index;

  modalImages = post.images && post.images.length ? post.images : [post.img];
  showModalImage(0);

  const caption = document.getElementById('modalCaption');
  caption.replaceChildren();

  const username = document.createElement('strong');
  username.textContent = 'ybab.mik';

  caption.append(username,document.createTextNode(post.caption));
  document.getElementById('modalDate').textContent = post.date || '';

  commentName.value = '';
  commentBody.value = '';
  commentSubmit.disabled = true;
  commentStatus.textContent = '로그인 없이 작성 가능 · 댓글은 공개됩니다.';

  bigHeart.classList.remove('pop');
  refreshPostUI();

  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  loadComments(index);
}

function closePost() {
  modal.classList.remove('open');
  document.body.style.overflow =
    storyViewer.classList.contains('open') ||
    photoViewer.classList.contains('open') ? 'hidden' : '';
}

document.getElementById('closeModal').addEventListener('click',closePost);

modal.addEventListener('click',event => {
  if (event.target === modal) closePost();
});

function showToast(message) {
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'),2300);
}

/* 현재 목록의 사진 수만큼 진행 바 칸을 만들고, 현재 칸은 차오르는 애니메이션으로 표시 */
function renderStoryProgress() {
  storyProgress.replaceChildren();

  currentList.forEach((_,i) => {
    const seg = document.createElement('div');
    seg.className = 'story-seg';

    const fill = document.createElement('i');
    seg.appendChild(fill);

    if (i < currentStoryIndex) {
      seg.classList.add('done');
    } else if (i === currentStoryIndex) {
      seg.classList.add('active');
      fill.style.animationDuration = STORY_DURATION + 'ms';
      fill.addEventListener('animationend',nextStory,{once:true});
    }

    storyProgress.appendChild(seg);
  });
}

/* list: stories(프로필 사진) 또는 highlights(하이라이트) */
function openStory(index,list = stories) {
  currentList = list;
  currentStoryIndex = Math.min(Math.max(index,0),list.length - 1);
  const story = list[currentStoryIndex];

  document.getElementById('storyPhoto').src = story.img;
  document.getElementById('storyTime').textContent = story.time;

  renderStoryProgress();

  storyViewer.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeStory() {
  storyViewer.classList.remove('open');
  storyProgress.replaceChildren();
  document.body.style.overflow =
    modal.classList.contains('open') ||
    photoViewer.classList.contains('open') ? 'hidden' : '';
}

/* 다음 사진으로, 마지막 사진이면 닫기 (자동 넘김과 오른쪽 탭 공통) */
function nextStory() {
  if (!storyViewer.classList.contains('open')) return;

  if (currentStoryIndex < currentList.length - 1) {
    openStory(currentStoryIndex + 1,currentList);
  } else {
    closeStory();
  }
}

/* 이전 사진으로, 첫 사진이면 처음부터 다시 */
function prevStory() {
  openStory(currentStoryIndex - 1,currentList);
}

function closeProfilePhoto() {
  photoViewer.classList.remove('open');
  document.body.style.overflow =
    modal.classList.contains('open') ||
    storyViewer.classList.contains('open') ? 'hidden' : '';
}

/* 프로필 사진을 누르면 스토리가 열립니다. */
document.getElementById('profilePhotoBtn').addEventListener('click',() => {
  openStory(0,stories);
});

document.getElementById('closeProfilePhoto').addEventListener('click',closeProfilePhoto);

photoViewer.addEventListener('click',event => {
  if (event.target === photoViewer) closeProfilePhoto();
});

/* New 버튼은 안내 메시지만 보여줍니다. */
document.getElementById('newStoryBtn').addEventListener('click',() => {
  showToast('새 스토리 업로드는 아직 데모 기능이야.');
});

/* 하이라이트 동그라미를 누르면 하이라이트 사진들이 열립니다. */
document.querySelectorAll('[data-highlight]').forEach(button => {
  button.addEventListener('click',() => openStory(0,highlights[Number(button.dataset.highlight)]));
});

document.getElementById('closeStory').addEventListener('click',closeStory);
document.getElementById('storyNext').addEventListener('click',nextStory);
document.getElementById('storyPrev').addEventListener('click',prevStory);

document.getElementById('storyMenuBtn').addEventListener('click',() => {
  showToast('스토리 메뉴는 데모 기능이야.');
});

document.addEventListener('keydown',event => {
  if (event.key === 'Escape') {
    if (photoViewer.classList.contains('open')) closeProfilePhoto();
    else if (storyViewer.classList.contains('open')) closeStory();
    else if (modal.classList.contains('open')) closePost();
  }

  if (storyViewer.classList.contains('open')) {
    if (event.key === 'ArrowRight') nextStory();
    if (event.key === 'ArrowLeft') prevStory();
  } else if (modal.classList.contains('open') && modalImages.length > 1 && document.activeElement.tagName !== 'INPUT') {
    if (event.key === 'ArrowRight') showModalImage(modalIndex + 1);
    if (event.key === 'ArrowLeft') showModalImage(modalIndex - 1);
  }
});

document.getElementById('followBtn').addEventListener('click',() => {
  const button = document.getElementById('followBtn');
  const following = button.classList.toggle('following');
  button.textContent = following ? '팔로잉⌄' : '팔로우';
  showToast(following ? '팔로잉 중입니다' : '팔로우를 시작했습니다');
});

document.getElementById('messageBtn').addEventListener('click',() => {
  showToast('가상 프로필에서는 메시지를 보낼 수 없습니다.');
});

document.getElementById('friendBtn').addEventListener('click',() => {
  showToast('추천 계정 기능은 데모용입니다.');
});

document.getElementById('bellBtn').addEventListener('click',() => {
  showToast('게시물 알림이 켜진 것처럼 표시됩니다.');
});

document.getElementById('backBtn').addEventListener('click',() => {
  showToast('데모 프로필 화면입니다.');
});

document.getElementById('moreBtn').addEventListener('click',() => {
  document.getElementById('menuPop').classList.toggle('show');
});

document.querySelectorAll('[data-toast]').forEach(button => {
  button.addEventListener('click',() => {
    showToast(button.dataset.toast);
    document.getElementById('menuPop').classList.remove('show');
  });
});

/* 모바일 하단 메뉴 버튼 */
document.querySelectorAll('.bottom-nav button').forEach(btn => {
  btn.addEventListener('click',() => showToast('데모 화면입니다.'));
});

const postsTab = document.getElementById('postsTab');
const taggedTab = document.getElementById('taggedTab');

postsTab.addEventListener('click',() => {
  postsTab.classList.add('active');
  taggedTab.classList.remove('active');
  postsTab.setAttribute('aria-selected','true');
  taggedTab.setAttribute('aria-selected','false');
  grid.style.display = 'grid';
});

taggedTab.addEventListener('click',() => {
  taggedTab.classList.add('active');
  postsTab.classList.remove('active');
  taggedTab.setAttribute('aria-selected','true');
  postsTab.setAttribute('aria-selected','false');
  grid.style.display = 'none';
  showToast('태그된 게시물이 없습니다.');
});
</script>
