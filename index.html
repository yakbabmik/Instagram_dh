
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>김도훈 (@yabab.mik) · Instagram</title>

<style>
:root {
  --ink:#171717;
  --muted:#737373;
  --line:#dbdbdb;
  --blue:#0095f6;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:#fff;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;
}
button,input { font:inherit; }
button { cursor:pointer; }
.app { max-width:975px; margin:auto; padding:26px 28px 56px; }

.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:34px;
}
.back,.more {
  border:0;
  background:transparent;
  padding:5px;
  color:#222;
}
.top-actions { display:flex; align-items:center; gap:20px; }
.menu { position:relative; }
.menu-pop {
  display:none;
  position:absolute;
  right:0;
  top:36px;
  z-index:5;
  min-width:170px;
  background:white;
  border:1px solid #eee;
  border-radius:8px;
  box-shadow:0 8px 30px #0001;
  overflow:hidden;
}
.menu-pop.show { display:block; }
.menu-pop button {
  display:block;
  width:100%;
  padding:12px 15px;
  border:0;
  background:white;
  text-align:left;
  font-size:13px;
}

.profile {
  display:grid;
  grid-template-columns:minmax(120px,1fr) 2fr;
  gap:34px;
  align-items:center;
  margin-bottom:36px;
}
.avatar-wrap { display:flex; justify-content:center; }
.avatar {
  width:150px;
  height:150px;
  border-radius:50%;
  padding:4px;
  background:linear-gradient(135deg,#ffb347,#ff5277,#a855f7);
  display:block;
  border:0;
  flex-shrink:0;
}
.avatar img {
  display:block;
  width:100%;
  height:100%;
  border-radius:50%;
  border:4px solid white;
  object-fit:cover;
}
.heading {
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.username { font-size:23px; font-weight:400; }
.verified {
  width:17px;
  height:17px;
  border-radius:50%;
  background:#3897f0;
  color:white;
  display:inline-grid;
  place-items:center;
  font-size:11px;
  font-weight:800;
}
.stats { display:flex; gap:38px; margin-bottom:20px; }
.stat { font-size:16px; }
.stat strong { font-weight:650; }
.bio { font-size:14px; line-height:1.7; }
.display-name { font-weight:650; }

.actions {
  display:grid;
  grid-template-columns:1fr 1fr 54px;
  gap:10px;
  margin-bottom:12px;
}
.action {
  border:1px solid var(--line);
  border-radius:7px;
  background:white;
  min-height:42px;
  font-weight:600;
  color:#262626;
}
.action.following { background:#f5f5f5; }

/* 하이라이트 */
.stories {
  display:flex;
  align-items:flex-start;
  gap:18px;
  overflow-x:auto;
  padding:12px 0 22px;
  margin:0 0 12px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.stories::-webkit-scrollbar { display:none; }
.story-item {
  flex:0 0 80px;
  width:80px;
  min-width:80px;
  padding:0;
  margin:0;
  border:0;
  background:transparent;
  color:#262626;
  text-align:center;
}
.story-ring {
  display:block;
  width:80px;
  height:80px;
  padding:4px;
  margin:0 auto 7px;
  border:1px solid #e6e7ea;
  border-radius:50%;
  background:#e8e9ec;
}
.story-ring img {
  display:block;
  width:100%;
  height:100%;
  border:3px solid #fff;
  border-radius:50%;
  background:#f5f5f5;
  object-fit:cover;
}
.add-story .new-ring {
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  border:1.3px solid #262626;
  background:#fff;
}
.add-story .plus {
  display:block;
  color:#111;
  font-size:42px;
  font-weight:300;
  line-height:1;
  transform:translateY(-2px);
}
.story-label {
  display:block;
  width:100%;
  overflow:hidden;
  color:#262626;
  font-size:12px;
  font-weight:400;
  line-height:18px;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* 게시물 / 태그 탭 */
.tabs {
  display:grid;
  grid-template-columns:1fr 1fr;
  width:100%;
  height:52px;
  gap:0;
  border-bottom:1px solid var(--line);
  margin-bottom:4px;
}
.tab {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  padding:0;
  border:0;
  background:transparent;
  color:#8e8e8e;
}
.tab svg { display:block; flex-shrink:0; }
.tab.active { color:#111; }
.tab.active:after {
  content:"";
  position:absolute;
  height:2px;
  background:#111;
  bottom:-1px;
  left:0;
  right:0;
}

.grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:4px;
}
.post {
  position:relative;
  aspect-ratio:1/1;
  border:0;
  padding:0;
  overflow:hidden;
  background:#eee;
}
.post img {
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:transform .25s;
}
.post:hover img { transform:scale(1.025); }
.heart { display:none !important; }

.post .caption {
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:22px 9px 9px;
  color:white;
  font-size:12px;
  line-height:1.4;
  text-align:left;
  background:linear-gradient(transparent,#0008);
}
.footer {
  padding:24px 0;
  color:#999;
  font-size:11px;
  text-align:center;
}

/* 게시물 상세 및 댓글 */
.modal {
  display:none;
  position:fixed;
  inset:0;
  z-index:10;
  background:#000b;
  align-items:center;
  justify-content:center;
  padding:44px 20px 20px;
}
.modal.open { display:flex; }
.close {
  position:fixed;
  top:12px;
  right:20px;
  color:white;
  background:transparent;
  border:0;
  font-size:36px;
  font-weight:200;
}
.modal-card {
  display:grid;
  grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);
  width:min(100%,1000px);
  max-height:90vh;
  background:white;
  overflow:hidden;
}
.modal-image {
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
  min-height:0;
}
.modal-image img {
  width:100%;
  height:100%;
  max-height:90vh;
  object-fit:contain;
}
.modal-side {
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
  overflow:hidden;
}
.modal-head {
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px;
  border-bottom:1px solid #eee;
  font-size:13px;
  font-weight:650;
  flex-shrink:0;
}
.tiny-avatar {
  width:30px;
  height:30px;
  border-radius:50%;
  padding:2px;
  background:linear-gradient(135deg,#ffb347,#ff5277,#a855f7);
}
.tiny-avatar img {
  display:block;
  width:100%;
  height:100%;
  border:2px solid white;
  border-radius:50%;
  object-fit:cover;
}
.modal-caption {
  padding:16px 15px;
  font-size:13px;
  line-height:1.7;
  border-bottom:1px solid #eee;
}
.modal-bottom {
  padding:13px 15px;
  font-size:13px;
  color:#555;
  border-bottom:1px solid #eee;
}
.comments-panel {
  display:flex;
  flex-direction:column;
  padding:13px 15px;
  min-height:0;
  flex:1;
}
.comments-title { font-size:14px; font-weight:650; margin-bottom:12px; }
.comments-list {
  display:flex;
  flex-direction:column;
  gap:12px;
  overflow-y:auto;
  min-height:70px;
  max-height:300px;
  font-size:13px;
  line-height:1.5;
  overflow-wrap:anywhere;
}
.comment-item { display:flex; gap:7px; }
.comment-name { font-weight:650; flex-shrink:0; }
.comment-text { white-space:pre-wrap; overflow-wrap:anywhere; }
.comment-empty { color:#999; padding:10px 0; }
.comment-form {
  margin-top:12px;
  border-top:1px solid #eee;
  padding-top:9px;
  flex-shrink:0;
}
.comment-form input {
  width:100%;
  min-width:0;
  border:0;
  outline:none;
  font:inherit;
  font-size:13px;
  padding:8px 0;
  background:transparent;
}
.comment-write-row { display:flex; align-items:center; gap:10px; }
.comment-write-row button {
  border:0;
  background:white;
  color:var(--blue);
  font-weight:650;
  font-size:13px;
  flex-shrink:0;
}
.comment-write-row button:disabled { opacity:.45; }
.comment-status { margin:5px 0 0; font-size:12px; color:#777; line-height:1.5; }

/* 스토리 전체 화면 */
.story-viewer {
  display:none;
  position:fixed;
  z-index:50;
  inset:0;
  align-items:center;
  justify-content:center;
  background:#101010;
  color:white;
}
.story-viewer.open { display:flex; }
.story-screen {
  position:relative;
  width:min(100%,430px);
  height:min(100dvh,900px);
  overflow:hidden;
  background:#202020;
}
.story-photo {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  background:#171717;
  object-fit:contain;
}
.story-shade {
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,#0008,transparent 22%,transparent 70%,#0008);
  pointer-events:none;
}
.story-progress {
  position:absolute;
  z-index:2;
  top:9px;
  left:8px;
  right:8px;
  height:2px;
  background:#ffffff66;
}
.story-progress-fill { width:100%; height:100%; background:white; }
.story-header {
  position:absolute;
  z-index:3;
  top:20px;
  left:12px;
  right:12px;
  display:flex;
  align-items:center;
  gap:9px;
}
.story-profile {
  width:35px;
  height:35px;
  border:1px solid #ffffff88;
  border-radius:50%;
  object-fit:cover;
}
.story-user { font-size:13px; font-weight:650; }
.story-time { color:#ffffffb8; font-size:12px; font-weight:400; }
.story-header-actions { display:flex; align-items:center; gap:14px; margin-left:auto; }
.story-icon {
  padding:2px;
  border:0;
  background:transparent;
  color:white;
  font-size:23px;
}
.story-close { font-size:30px; font-weight:300; }
.story-nav {
  position:absolute;
  z-index:2;
  top:65px;
  bottom:15px;
  width:28%;
  border:0;
  background:transparent;
}
.story-prev { left:0; }
.story-next { right:0; }

.toast {
  position:fixed;
  left:50%;
  bottom:28px;
  transform:translate(-50%,20px);
  opacity:0;
  background:#262626;
  color:white;
  padding:11px 16px;
  border-radius:8px;
  font-size:13px;
  transition:.25s;
  pointer-events:none;
  z-index:100;
}
.toast.show { opacity:1; transform:translate(-50%,0); }

@media(max-width:650px) {
  .app { padding:14px 0 40px; }
  .topbar { padding:0 16px; margin-bottom:20px; }
  .profile {
    grid-template-columns:100px 1fr;
    gap:16px;
    padding:0 16px;
    margin-bottom:22px;
    align-items:start;
  }
  .avatar { width:86px; height:86px; padding:3px; }
  .heading { gap:7px; margin-bottom:15px; }
  .username { font-size:19px; }
  .stats { gap:0; justify-content:space-between; margin-bottom:14px; }
  .stat { font-size:12px; text-align:center; }
  .stat strong { display:block; font-size:15px; }
  .bio { font-size:12px; }
  .actions {
    padding:0 12px;
    grid-template-columns:1fr 1fr 42px;
    gap:6px;
    margin-bottom:12px;
  }
  .action { min-height:36px; font-size:13px; }
  .stories { gap:18px; padding:12px 12px 22px; margin:0 0 12px; }
  .story-item { flex:0 0 80px; width:80px; min-width:80px; }
  .story-ring { width:80px; height:80px; }
  .tabs { grid-template-columns:1fr 1fr; gap:0; height:48px; }
  .tab { padding:0; }
  .tab svg { width:26px; height:26px; }
  .grid { gap:2px; }
  .post .caption { display:none; }
  .modal { padding:38px 0 0; align-items:flex-start; }
  .modal-card {
    display:flex;
    flex-direction:column;
    width:100%;
    max-width:480px;
    max-height:94vh;
    overflow:auto;
  }
  .modal-image { flex-shrink:0; aspect-ratio:1/1; min-height:0; }
  .modal-image img { width:100%; height:100%; max-height:none; object-fit:cover; }
  .modal-side { overflow:visible; }
  .comments-list { max-height:180px; }
  .close { top:2px; right:12px; }
  .story-screen { width:100%; height:100dvh; }
}
</style>
</head>

<body>
<main class="app">
  <header class="topbar">
    <button class="back" id="backBtn" aria-label="뒤로">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 3 6 12l9 9"/></svg>
    </button>
    <div class="top-actions">
      <button class="more" id="bellBtn" aria-label="알림">
        <svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4M12 3V1"/></svg>
      </button>
      <div class="menu">
        <button class="more" id="moreBtn" aria-label="더 보기">•••</button>
        <div class="menu-pop" id="menuPop">
          <button data-toast="가상 프로필 링크입니다">프로필 링크 복사</button>
          <button data-toast="이 프로필은 데모용 가상 계정입니다">이 프로필 정보</button>
        </div>
      </div>
    </div>
  </header>

  <section class="profile">
    <div class="avatar-wrap">
      <button class="avatar" id="profileStoryBtn" aria-label="프로필 스토리 보기">
        <img src="./브이.jpg" alt="김도훈 프로필 사진">
      </button>
    </div>
    <div class="profile-info">
      <div class="heading"><span class="username">yabab.mik</span><span class="verified">✓</span></div>
      <div class="stats">
        <div class="stat"><strong>9</strong> 게시물</div>
        <div class="stat"><strong>3,482</strong> 팔로워</div>
        <div class="stat"><strong>5</strong> 팔로잉</div>
      </div>
      <div class="bio"><div class="display-name">김도훈</div></div>
    </div>
  </section>

  <section class="actions">
    <button class="action following" id="followBtn">팔로잉⌄</button>
    <button class="action" id="messageBtn">메시지</button>
    <button class="action" id="friendBtn" aria-label="비슷한 계정">⌄</button>
  </section>

  <section class="stories" aria-label="스토리 하이라이트">
    <button class="story-item add-story" id="newStoryBtn">
      <span class="story-ring new-ring"><span class="plus">＋</span></span>
      <span class="story-label">New</span>
    </button>
    <button class="story-item" data-story="0">
      <span class="story-ring"><img src="./하나만먹자.jpg" alt="강아지"></span>
      <span class="story-label">공놀이</span>
    </button>
    <button class="story-item" data-story="1">
      <span class="story-ring"><img src="./브이.jpg" alt="일상"></span>
      <span class="story-label">📷</span>
    </button>
    <button class="story-item" data-story="2">
      <span class="story-ring"><img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=300&q=80" alt="카페"></span>
      <span class="story-label">📷</span>
    </button>
    <button class="story-item" data-story="3">
      <span class="story-ring"><img src="https://images.unsplash.com/photo-1490730141103-6cac27aaab94?auto=format&fit=crop&w=300&q=80" alt="일상"></span>
      <span class="story-label">일상</span>
    </button>
  </section>

  <nav class="tabs" aria-label="프로필 게시물 메뉴">
    <button class="tab active" id="postsTab" aria-label="게시물" aria-selected="true">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true">
        <rect x="1" y="1" width="6" height="6" rx="1.1"/>
        <rect x="9" y="1" width="6" height="6" rx="1.1"/>
        <rect x="17" y="1" width="6" height="6" rx="1.1"/>
        <rect x="1" y="9" width="6" height="6" rx="1.1"/>
        <rect x="9" y="9" width="6" height="6" rx="1.1"/>
        <rect x="17" y="9" width="6" height="6" rx="1.1"/>
        <rect x="1" y="17" width="6" height="6" rx="1.1"/>
        <rect x="9" y="17" width="6" height="6" rx="1.1"/>
        <rect x="17" y="17" width="6" height="6" rx="1.1"/>
      </svg>
    </button>
    <button class="tab" id="taggedTab" aria-label="태그된 게시물" aria-selected="false">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2.5" y="2.5" width="19" height="19" rx="1.5"/>
        <circle cx="12" cy="9" r="3.2"/>
        <path d="M5.5 19c.9-3 3.2-4.5 6.5-4.5s5.6 1.5 6.5 4.5"/>
      </svg>
    </button>
  </nav>

  <section class="grid" id="postGrid" aria-label="게시물 9개"></section>
  <div class="footer">이 페이지는 포트폴리오·팬메이드용 가상 프로필입니다. Instagram과 제휴하지 않습니다.</div>
</main>

<div class="modal" id="postModal" role="dialog" aria-modal="true" aria-label="게시물 상세">
  <button class="close" id="closeModal" aria-label="닫기">×</button>
  <div class="modal-card">
    <div class="modal-image"><img id="modalImg" src="" alt="게시물 이미지"></div>
    <div class="modal-side">
      <div class="modal-head">
        <div class="tiny-avatar"><img src="./브이.jpg" alt=""></div>
        <span>yabab.mik</span><span style="margin-left:auto">•••</span>
      </div>
      <div class="modal-caption" id="modalCaption"></div>
      <div class="modal-bottom" id="modalLikes"></div>
      <section class="comments-panel">
        <div class="comments-title">댓글</div>
        <div id="commentsList" class="comments-list">게시물을 선택해 주세요.</div>
        <form id="commentForm" class="comment-form">
          <input id="commentName" type="text" maxlength="30" placeholder="닉네임 (비워두면 익명)" aria-label="닉네임">
          <div class="comment-write-row">
            <input id="commentBody" type="text" maxlength="500" placeholder="댓글 달기..." aria-label="댓글 내용" required>
            <button id="commentSubmit" type="submit">게시</button>
          </div>
          <p id="commentStatus" class="comment-status" aria-live="polite">로그인 없이 작성 가능 · 댓글은 공개됩니다.</p>
        </form>
      </section>
    </div>
  </div>
</div>

<div class="story-viewer" id="storyViewer" role="dialog" aria-modal="true" aria-label="스토리">
  <div class="story-screen">
    <img class="story-photo" id="storyPhoto" src="./하나만먹자.jpg" alt="스토리 사진">
    <div class="story-shade"></div>
    <div class="story-progress"><div class="story-progress-fill"></div></div>
    <div class="story-header">
      <img class="story-profile" src="./브이.jpg" alt="">
      <div>
        <div class="story-user">yabab.mik <span class="story-time" id="storyTime">· 3시간</span></div>
      </div>
      <div class="story-header-actions">
        <button class="story-icon" id="storyMenuBtn" aria-label="스토리 메뉴">•••</button>
        <button class="story-icon story-close" id="closeStory" aria-label="스토리 닫기">×</button>
      </div>
    </div>
    <button class="story-nav story-prev" id="storyPrev" aria-label="이전 스토리"></button>
    <button class="story-nav story-next" id="storyNext" aria-label="다음 스토리"></button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
const SUPABASE_URL = 'https://jukqqeripicztlkadwew.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Ppmfo2If2wWIb6BAt25E-A_FZUoxnNi';

const posts = [
  {img:"https://images.unsplash.com/photo-1511988617509-a57c8a288659?auto=format&fit=crop&w=900&q=85",caption:"별거 아닌 하루도 너랑 있으면 기억하고 싶어 🤍",likes:"좋아요 284개",tag:"데이트"},
  {img:"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=900&q=85",caption:"우리 단골 될 것 같은 곳. 다음엔 네가 커피 사기 ☕",likes:"좋아요 196개",tag:"카페"},
  {img:"https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=85",caption:"집 가기 아쉬워서 한 정거장 더 걷기",likes:"좋아요 331개",tag:"산책"},
  {img:"https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=900&q=85",caption:"사진 찍는 건 어색한데 너랑은 자꾸 남기게 돼 📸",likes:"좋아요 402개",tag:"커플"},
  {img:"https://images.unsplash.com/photo-1490730141103-6cac27aaab94?auto=format&fit=crop&w=900&q=85",caption:"정환이 형이 골라준 노을 색",likes:"좋아요 257개",tag:"노을"},
  {img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=85",caption:"아무 계획 없이 떠난 주말, 이런 게 좋다",likes:"좋아요 178개",tag:"여행"},
  {img:"https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=85",caption:"너는 내 사진첩에 너무 많아",likes:"좋아요 516개",tag:"일상"},
  {img:"https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=85",caption:"우리만 아는 작은 여행 🌿",likes:"좋아요 223개",tag:"여행"},
  {img:"https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=900&q=85",caption:"오래오래 지금처럼. 🖤",likes:"좋아요 648개",tag:"럽스타그램"}
];

const stories = [
  {img:"./하나만먹자.jpg",time:"· 3시간"},
  {img:"./브이.jpg",time:"· 5시간"},
  {img:"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=900&q=85",time:"· 8시간"},
  {img:"https://images.unsplash.com/photo-1490730141103-6cac27aaab94?auto=format&fit=crop&w=900&q=85",time:"· 1일"}
];

const grid = document.getElementById('postGrid');
const modal = document.getElementById('postModal');
const commentsList = document.getElementById('commentsList');
const commentForm = document.getElementById('commentForm');
const commentName = document.getElementById('commentName');
const commentBody = document.getElementById('commentBody');
const commentSubmit = document.getElementById('commentSubmit');
const commentStatus = document.getElementById('commentStatus');
const storyViewer = document.getElementById('storyViewer');
const toast = document.getElementById('toast');

let currentPostId = 0;
let currentStoryIndex = 0;
let toastTimer;

function supabaseHeaders() {
  return {'apikey':SUPABASE_KEY};
}

/* 게시물 격자 */
posts.forEach((post,index) => {
  const button = document.createElement('button');
  button.className = 'post';
  button.setAttribute('aria-label',`게시물 ${index+1}: ${post.caption}`);

  const img = document.createElement('img');
  img.src = post.img;
  img.alt = post.tag + ' 사진';
  img.loading = index > 2 ? 'lazy' : 'eager';

  const caption = document.createElement('span');
  caption.className = 'caption';
  caption.textContent = post.caption;

  button.append(img,caption);
  button.addEventListener('click',()=>openPost(index));
  grid.appendChild(button);
});

/* 댓글 조회 */
async function loadComments(postId) {
  commentsList.replaceChildren();
  commentsList.textContent = '댓글을 불러오는 중...';

  try {
    const url = `${SUPABASE_URL}/rest/v1/comments`+
      `?post_id=eq.${postId}`+
      '&select=id,display_name,body,created_at'+
      '&order=created_at.asc';

    const response = await fetch(url,{
      method:'GET',
      headers:supabaseHeaders()
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${await response.text()}`);
    }

    const comments = await response.json();
    commentsList.replaceChildren();

    if (!comments.length) {
      const empty = document.createElement('div');
      empty.className = 'comment-empty';
      empty.textContent = '첫 댓글을 남겨 보세요 🤍';
      commentsList.appendChild(empty);
      return;
    }

    comments.forEach(comment => {
      const item = document.createElement('div');
      item.className = 'comment-item';

      const name = document.createElement('span');
      name.className = 'comment-name';
      name.textContent = comment.display_name || '익명';

      const body = document.createElement('span');
      body.className = 'comment-text';
      body.textContent = comment.body;

      item.append(name,body);
      commentsList.appendChild(item);
    });
  } catch(error) {
    console.error('댓글 조회 오류:',error);
    commentsList.textContent = '댓글을 불러오지 못했어요. Supabase 설정과 권한을 확인해 주세요.';
    commentStatus.textContent = '오류가 계속되면 개발자 도구 Console을 확인해 주세요.';
  }
}

/* 댓글 등록 */
commentForm.addEventListener('submit',async event => {
  event.preventDefault();

  const displayName = commentName.value.trim() || '익명';
  const body = commentBody.value.trim();

  if (!body) {
    commentStatus.textContent = '댓글 내용을 입력해 줘.';
    return;
  }

  if (displayName.length > 30 || body.length > 500) {
    commentStatus.textContent = '닉네임은 30자, 댓글은 500자까지 가능해.';
    return;
  }

  commentSubmit.disabled = true;
  commentStatus.textContent = '댓글을 등록하는 중...';

  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/comments`,{
      method:'POST',
      headers:{
        ...supabaseHeaders(),
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      },
      body:JSON.stringify({
        post_id:currentPostId,
        display_name:displayName,
        body:body
      })
    });

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}: ${await response.text()}`);
    }

    commentBody.value = '';
    commentStatus.textContent = '댓글이 등록됐어!';
    await loadComments(currentPostId);
  } catch(error) {
    console.error('댓글 등록 오류:',error);
    commentStatus.textContent = '등록에 실패했어. Supabase 테이블과 권한을 확인해 줘.';
  } finally {
    commentSubmit.disabled = false;
  }
});

/* 게시물 상세 */
function openPost(index) {
  const post = posts[index];
  currentPostId = index;

  document.getElementById('modalImg').src = post.img;

  const caption = document.getElementById('modalCaption');
  caption.replaceChildren();

  const username = document.createElement('strong');
  username.textContent = 'yabab.mik';

  const captionText = document.createTextNode(' '+post.caption);
  caption.append(username,captionText);

  document.getElementById('modalLikes').textContent = post.likes;

  commentName.value = '';
  commentBody.value = '';
  commentStatus.textContent = '로그인 없이 작성 가능 · 댓글은 공개됩니다.';

  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  loadComments(index);
}

function closePost() {
  modal.classList.remove('open');
  document.body.style.overflow = storyViewer.classList.contains('open') ? 'hidden' : '';
}

document.getElementById('closeModal').addEventListener('click',closePost);
modal.addEventListener('click',event => {
  if (event.target === modal) closePost();
});

/* 알림 메시지 */
function showToast(message) {
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('show'),2300);
}

/* 스토리 열기 / 넘기기 */
function openStory(index) {
  currentStoryIndex = (index+stories.length)%stories.length;
  const story = stories[currentStoryIndex];

  document.getElementById('storyPhoto').src = story.img;
  document.getElementById('storyTime').textContent = story.time;

  storyViewer.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeStory() {
  storyViewer.classList.remove('open');
  document.body.style.overflow = modal.classList.contains('open') ? 'hidden' : '';
}

function nextStory() {
  openStory((currentStoryIndex+1)%stories.length);
}

function prevStory() {
  openStory((currentStoryIndex-1+stories.length)%stories.length);
}

document.getElementById('profileStoryBtn').addEventListener('click',()=>openStory(1));

document.getElementById('newStoryBtn').addEventListener('click',()=>{
  openStory(0);
  showToast('새 스토리 업로드는 아직 데모 기능이야.');
});

document.querySelectorAll('[data-story]').forEach(button=>{
  button.addEventListener('click',()=>openStory(Number(button.dataset.story)));
});

document.getElementById('closeStory').addEventListener('click',closeStory);
document.getElementById('storyNext').addEventListener('click',nextStory);
document.getElementById('storyPrev').addEventListener('click',prevStory);

document.getElementById('storyMenuBtn').addEventListener('click',()=>showToast('스토리 메뉴는 데모 기능이야.'));

/* 키보드 조작 */
document.addEventListener('keydown',event=>{
  if (event.key === 'Escape') {
    if (storyViewer.classList.contains('open')) closeStory();
    else if (modal.classList.contains('open')) closePost();
  }

  if (storyViewer.classList.contains('open')) {
    if (event.key === 'ArrowRight') nextStory();
    if (event.key === 'ArrowLeft') prevStory();
  }
});

/* 프로필 데모 버튼 */
document.getElementById('followBtn').addEventListener('click',()=>{
  const button = document.getElementById('followBtn');
  const following = button.classList.toggle('following');
  button.textContent = following ? '팔로잉⌄' : '팔로우';
  showToast(following ? '팔로잉 중입니다' : '팔로우를 시작했습니다');
});

document.getElementById('messageBtn').addEventListener('click',()=>showToast('가상 프로필에서는 메시지를 보낼 수 없습니다.'));
document.getElementById('friendBtn').addEventListener('click',()=>showToast('추천 계정 기능은 데모용입니다.'));
document.getElementById('bellBtn').addEventListener('click',()=>showToast('게시물 알림이 켜진 것처럼 표시됩니다.'));
document.getElementById('backBtn').addEventListener('click',()=>showToast('데모 프로필 화면입니다.'));

document.getElementById('moreBtn').addEventListener('click',()=>{
  document.getElementById('menuPop').classList.toggle('show');
});

document.querySelectorAll('[data-toast]').forEach(button=>{
  button.addEventListener('click',()=>{
    showToast(button.dataset.toast);
    document.getElementById('menuPop').classList.remove('show');
  });
});

/* 그리드 / 태그 탭 */
const postsTab = document.getElementById('postsTab');
const taggedTab = document.getElementById('taggedTab');

postsTab.addEventListener('click',()=>{
  postsTab.classList.add('active');
  taggedTab.classList.remove('active');
  postsTab.setAttribute('aria-selected','true');
  taggedTab.setAttribute('aria-selected','false');
  grid.style.display = 'grid';
});

taggedTab.addEventListener('click',()=>{
  taggedTab.classList.add('active');
  postsTab.classList.remove('active');
  taggedTab.setAttribute('aria-selected','true');
  postsTab.setAttribute('aria-selected','false');
  grid.style.display = 'none';
  showToast('태그된 게시물이 없습니다.');
});
</script>
</body>
